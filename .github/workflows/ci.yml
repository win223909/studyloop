name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:classroom
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t studyloop:test .
      - run: |
          docker run -d --name studyloop -p 127.0.0.1:3210:3210 studyloop:test
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3210/api/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3210/studio >/dev/null
          curl --fail http://127.0.0.1:3210/api/server-providers >/dev/null
      - run: docker logs studyloop
        if: failure()
